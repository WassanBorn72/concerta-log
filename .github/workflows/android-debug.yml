name: Build Android APKs

on:
  push:
    branches: ["release-apk"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android-app/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug and unsigned release APKs
        working-directory: android-app
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect release signing tool
        run: cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-app/app/build/outputs/apk/release/apksigner.jar

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: concerta-log-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare unsigned release artifact
        run: cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk android-app/app/build/outputs/apk/release/concerta-log-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: concerta-log-release-unsigned
          path: |
            android-app/app/build/outputs/apk/release/concerta-log-unsigned.apk
            android-app/app/build/outputs/apk/release/apksigner.jar
