name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secret context
        env:
          TEST_ALIAS: ${{ secrets.CONCERTA_LOG_KEY_ALIAS }}
        run: |
          test -n "$TEST_ALIAS"
          echo "Secret context is valid"
