name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CONCERTA_LOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/concerta-log-release.jks"

      - name: Build signed release APK and AAB
        working-directory: android-app
        env:
          CONCERTA_LOG_KEYSTORE_PATH: ${{ runner.temp }}/concerta-log-release.jks
          CONCERTA_LOG_KEYSTORE_PASSWORD: ${{ secrets.CONCERTA_LOG_KEYSTORE_PASSWORD }}
          CONCERTA_LOG_KEY_ALIAS: ${{ secrets.CONCERTA_LOG_KEY_ALIAS }}
          CONCERTA_LOG_KEY_PASSWORD: ${{ secrets.CONCERTA_LOG_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare release artifacts
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk concerta-log.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab concerta-log.aab

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs concerta-log.apk

      - name: Verify AAB signature
        run: jarsigner -verify concerta-log.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: concerta-log-release
          if-no-files-found: error
          path: |
            concerta-log.apk
            concerta-log.aab
