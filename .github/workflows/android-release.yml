name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate secret context
        env:
          TEST_ALIAS: ${{ secrets.CONCERTA_LOG_KEY_ALIAS }}
        run: |
          test -n "$TEST_ALIAS"
          echo "Setup and secret context are valid"
