name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CONCERTA_LOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/concerta-log-release.jks"

      - name: Build signed release APK and AAB
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CONCERTA_LOG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CONCERTA_LOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CONCERTA_LOG_KEY_PASSWORD }}
        run: |
          export CONCERTA_LOG_KEYSTORE_PATH="$RUNNER_TEMP/concerta-log-release.jks"
          export CONCERTA_LOG_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export CONCERTA_LOG_KEY_ALIAS="$KEY_ALIAS"
          export CONCERTA_LOG_KEY_PASSWORD="$KEY_PASSWORD"
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Prepare release artifacts
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk concerta-log.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab concerta-log.aab

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs concerta-log.apk

      - name: Verify AAB signature
        shell: bash
        run: |
          jarsigner -verify concerta-log.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: concerta-log-release
          path: |
            concerta-log.apk
            concerta-log.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             concerta-log.apk             concerta-log.aab             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$GITHUB_REF_NAME"             --generate-notes
