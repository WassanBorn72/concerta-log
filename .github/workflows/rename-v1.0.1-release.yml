name: Rename v1.0.1 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message == 'Rename v1.0.1 GitHub Release'
    runs-on: ubuntu-latest
    steps:
      - name: Rename release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v1.0.1"             --repo "$GITHUB_REPOSITORY"             --title "concerta-log v1.0.1"
